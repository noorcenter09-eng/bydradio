name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build
        run: gradle assembleRelease --no-daemon -PverCode=${{ github.run_number }} -PghRepo=${{ github.repository }}
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk BYDRadio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BYDRadio
          path: BYDRadio.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Version 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: BYDRadio.apk
